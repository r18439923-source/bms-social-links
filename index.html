
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#243B64">
  <title>BMS Pharmaceutical | Connect With Us</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #243B64;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: white;
      padding: 36px 24px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(36,59,100,.10);
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #68758b;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .link {
      display: block;
      text-decoration: none;
      color: white;
      background: #243B64;
      padding: 16px;
      margin: 14px 0;
      border-radius: 12px;
      font-weight: bold;
      transition: opacity .2s;
    }

    .link:hover { opacity: .85; }

    .whatsapp { background: #168653; }

    footer {
      color: #7b8494;
      font-size: 12px;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="brand">BMS Pharmaceutical</div>
    <p class="subtitle">
      Connect with us<br>
      Choose your preferred platform
    </p>

    <a class="link"
       href="https://www.instagram.com/bms.pharmaceutical/"
       target="_blank" rel="noopener noreferrer">
      Instagram
    </a>

    <a class="link"
       href="https://www.facebook.com/profile.php?id=61592935267065"
       target="_blank" rel="noopener noreferrer">
      Facebook
    </a>

    <a class="link whatsapp"
       href="https://wa.me/message/KQQZZWIDCRO3J1"
       target="_blank" rel="noopener noreferrer">
      WhatsApp
    </a>

    <footer>© BMS Pharmaceutical</footer>
  </main>
</body>
</html>
